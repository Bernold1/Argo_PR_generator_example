{{- $app := .Values }}
{{- if and (not $app.isPostgres) $app.seeding $app.seeding.enabled }}
{{- $seedFile := printf "seeds/%s.sql" $app.serviceName }}
{{- $seedContent := .Files.Get $seedFile }}
{{- if $seedContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app.serviceName }}-seed-data
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ $app.serviceName }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "0"
data:
  seed.sql: |
{{ $seedContent | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $app.serviceName }}-seed
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ $app.serviceName }}-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/hook-weight: "1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: {{ $app.serviceName }}-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: registry.example.com/public-cache/postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: seed
          image: registry.example.com/public-cache/postgres:18
          env:
            - name: PGHOST
              value: "postgres-service"
            - name: PGUSER
              value: {{ $app.seeding.dbUser | default $app.serviceName | quote }}
            - name: PGDATABASE
              value: {{ $app.seeding.dbName | default $app.serviceName | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Seeding {{ $app.serviceName }}..."
              psql -f /seeds/seed.sql
              echo "Done."
          volumeMounts:
            - name: seed-data
              mountPath: /seeds
      volumes:
        - name: seed-data
          configMap:
            name: {{ $app.serviceName }}-seed-data
{{- end }}
{{- end }}
