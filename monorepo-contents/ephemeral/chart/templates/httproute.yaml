{{- $app := .Values }}
{{- if not $app.isPostgres }}
{{- $routes := list }}
{{- if $app.httpRoute }}
{{- $routes = append $routes (dict "name" $app.serviceName "rules" $app.httpRoute.rules) }}
{{- end }}
{{- if and $app.hasProcessor $app.processorHttpRoute }}
{{- $routes = append $routes (dict "name" (printf "%s-processor" $app.serviceName) "rules" $app.processorHttpRoute.rules) }}
{{- end }}
{{- range $routes }}
{{- $route := . }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    {{- range (default (list (dict "name" (printf "%s-gateway" $.Release.Namespace) "namespace" "gateway-system")) $app.parentRefs) }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  hostnames:
    {{- range (default (list (printf "%s.dev.example.com" (toString $app.pullRequestId))) $app.hostnames) }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range $route.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - kind: Service
          name: {{ $route.name }}
          namespace: {{ $.Release.Namespace | quote }}
          port: {{ $app.port }}
          weight: 1
    {{- end }}
{{- end }}
{{- end }}
