{{- if .Values.platformSecretsRequired }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-client-secret
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: example-secret-store
  target:
    name: oauth2-client-secret
    creationPolicy: Owner
  data:
    - secretKey: oauth2-client-secret
      remoteRef:
        key: secret/example-oauth2-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-client-id
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: example-secret-store
  target:
    name: oidc-client-id
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: secret/example-oidc-client-id
{{- end }}
